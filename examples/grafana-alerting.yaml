apiVersion: 1

contactPoints:
  - name: telegram
    orgId: 1
    receivers:
      - uid: relay-telegram
        type: webhook
        settings:
          url: http://relay:8080/webhook/grafana
          maxAlerts: 0

policies:
  - orgId: 1
    receiver: telegram
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 1h
    group_by:
      - grafana_folder
      - alertname
